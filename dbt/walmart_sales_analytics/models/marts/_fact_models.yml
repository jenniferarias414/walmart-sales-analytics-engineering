version: 2

models:
  - name: walmart_fact_table
    description: SCD2-style Walmart fact table with one versioned row per store, department, and date sales record.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - store_id
              - dept_id
              - date_id
              - vrsn_start_date
    columns:
      - name: store_id
        description: Store identifier.
        data_tests:
          - not_null

      - name: dept_id
        description: Department identifier.
        data_tests:
          - not_null

      - name: date_id
        description: Date key in YYYYMMDD format.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('walmart_date_dim')
                field: date_id

      - name: store_size
        description: Store size carried into the fact table to match the supplied target design.
        data_tests:
          - not_null

      - name: store_weekly_sales
        description: Weekly sales amount.
        data_tests:
          - not_null

      - name: fuel_price
        description: Fuel price for the store/date context record.
        data_tests:
          - not_null

      - name: store_temperature
        description: Temperature for the store/date context record.
        data_tests:
          - not_null

      - name: unemployment
        description: Unemployment value for the store/date context record.
        data_tests:
          - not_null

      - name: cpi
        description: CPI value for the store/date context record.
        data_tests:
          - not_null

      - name: markdown1
        description: Markdown field 1. Nulls are preserved from the source.

      - name: markdown2
        description: Markdown field 2. Nulls are preserved from the source.

      - name: markdown3
        description: Markdown field 3. Nulls are preserved from the source.

      - name: markdown4
        description: Markdown field 4. Nulls are preserved from the source.

      - name: markdown5
        description: Markdown field 5. Nulls are preserved from the source.

      - name: vrsn_start_date
        description: Timestamp when this fact version became valid.
        data_tests:
          - not_null

      - name: vrsn_end_date
        description: Timestamp when this fact version ended. Null means the record is current.

      - name: insert_date
        description: Timestamp when this fact version was inserted.
        data_tests:
          - not_null

      - name: update_date
        description: Timestamp when this fact version was most recently processed by the snapshot.
        data_tests:
          - not_null
